# Phase 3 adapted scope: Nigerian Pidgin (pcm) fine-tuning variant.
# ISOLATION RULE: nothing in this file modifies configs/baseline.yaml — the
# general-English checkpoint stays pinned and untouched (task constraint).

variant: "pidgin-v0"
checkpoint_id: "voxcpm2-pidgin-v0"          # distinct id; baseline keeps checkpoint_id voxcpm2

base_model:
  hf_model_id: "openbmb/VoxCPM2"
  revision: "32279effe8c19989596f05d353d1447f51d9e915"   # pinned snapshot, identical to baseline
  load_denoiser: true
  zipenhancer_model_id: "iic/speech_zipenhancer_ans_multiloss_16k_base"
  optimize: true

tuned_weights:
  # Filled by the fine-tuning notebook; empty = run the pure baseline.
  lora_weights_path: ""
  sample_rate: 48000

data:
  source_name: "michaelodafe/pidgin-asr-combined"      # primary (route change v2, 2026-10-17)
  source_upstream: "asr-nigerian-pidgin/nigerian-pidgin-1.0 (Rufai et al., arXiv:2010.11123)"
  license_id: "CC-BY-4.0"
  language: "pcm"
  hf_dataset: "michaelodafe/pidgin-asr-combined"
  excluded_sources: ["Rexe"]   # 73 test-side clips, license unspecified → hard-excluded
  manifests_dir: "data/manifests"
  expected_hours: 8.56         # after Rexe exclusion ≈ 8.51 h (train 5.41 / val 1.37 / test 1.78 upstream)
  note: "CV 25.0 pcm (12.5 h, 59 speakers) remains the scale-up option via Mozilla Data
         Collective — reachable only with a browser account; see docs/pidgin_dataset_sourcing.md v2"
  split_fractions:          # speaker-disjoint (builder enforces; 10 speakers → 8/1/1)
    train: 0.8
    val: 0.1
    test: 0.1
  splits_locked: true       # locked 2026-10-17 (schema verified; 10 speakers → 8/1/1)

training:
  # VERIFIED 2026-10-17 against the official VoxCPM2 recipe
  # (OpenBMB/VoxCPM conf/voxcpm_v2/voxcpm_finetune_lora.yaml — values copied, not guessed).
  # Driver: python scripts/train_voxcpm_finetune.py --config_path <this-style yaml>
  # (driver itself fetched from OpenBMB/VoxCPM on the runtime; LoRA needs only
  # 5-10 min of audio per official README — our 12.5 h is ample).
  method: "lora"
  seed: 3407
  sample_rate: 16000        # AudioVAE encoder input rate during training; output stays 48k
  batch_size: 2
  grad_accum_steps: 8       # effective batch = 16
  num_iters: 1000           # official default; feasibility probe uses 50
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  max_grad_norm: 1.0
  max_batch_tokens: 8192
  lora:
    r: 32
    alpha: 32
    dropout: 0.0
    enable_lm: true
    enable_dit: true
    enable_proj: false
  inference_timesteps: 10   # eval/generation settings mirror baseline for fair A/B
  cfg_value: 2.0

evaluation:
  benchmark_passages: "benchmarks/pidgin_eval/passages.json"
  wer_recognizer: "facebook/mms-1b-all (pcm) — CC-BY-NC, research use only"  # placeholder; verify
  human_eval:
    min_speakers: 3         # hard constraint: real Pidgin speakers, PRD §5.5
    scale: "1-5 naturalness + 1-5 Pidgin authenticity"

license:
  # ROUTE CHANGED 2026-10-17 (v2): primary is now the HF-hosted pidgin-asr-combined
  # (CC-BY-4.0). Evidence base for the flags below:
  #   - https://huggingface.co/datasets/michaelodafe/pidgin-asr-combined (card: license
  #     cc-by-4.0, full source table + attribution/citation requirements, read this date)
  #   - upstream https://huggingface.co/datasets/asr-nigerian-pidgin/nigerian-pidgin-1.0
  #     (card: CC-BY-4.0, academic release, voluntary in-app recordings, TTS listed as a
  #     supported task)
  # Remaining review items before flags flip (L1'/L2'):
  #   [ ] read the CC-BY-4.0 attribution terms on the card + cite requirements (done-read flag)
  #   [ ] consent scope check: voluntary recordings, published academic release, TTS-use
  #       explicitly supported, multi-speaker mixture → recorded here for the sign-off
  source_name: "michaelodafe/pidgin-asr-combined"
  license_id: "CC-BY-4.0"
  # CLEARED 2026-10-17 - PM sign-off (Emmanuel, "proceed" on the 3-point review):
  # attribution terms acknowledged, voluntary academic recordings w/ TTS listed,
  # 10-speaker mixture (no cloning). Rexe rows stay hard-excluded regardless.
  license_cleared: true
  consent_review_done: true
  # L3 CLEARED 2026-10-17: base checkpoint is Apache-2.0 — evidence:
  #   - https://huggingface.co/openbmb/VoxCPM2 (model card: license apache-2.0,
  #     "Fully Open-Source & Commercial-Ready", fine-tuning officially supported)
  #   - https://github.com/OpenBMB/VoxCPM LICENSE (full Apache-2.0 text, fetched)
  base_checkpoint_license_ok: true

# Owner decisions recorded 2026-10-17 (Emmanuel / PM sign-off):
decisions:
  dataset_route: "v2: pidgin-asr-combined (CC-BY-4.0, HF-hosted). v1 was CV pcm —
                  moved 2026-10-17 because mozilla-foundation/common_voice_25_0 does
                  NOT exist on HF (Data-Collective-only) and the CV 17/18 HF mirrors
                  verified to lack pcm; Data Collective route documented as scale-up."
  compute: "feasibility probe on free T4; full fine-tune on paid A100 (~15-25 h est., re-estimate after Stage 4)"
